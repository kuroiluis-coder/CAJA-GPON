plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cajasgpon.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cajasgpon.app'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '1.3'
    }
    androidResources {
        noCompress 'pmtiles'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
